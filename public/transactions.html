<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Transactions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Inventory Management System</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="suppliers.html">Suppliers</a>
            <a href="transactions.html">Transactions</a>
        </nav>
    </header>

    <main>
        <h2>Stock Transactions</h2>

        <form id="transactionForm">
            <label>Select Product</label>
            <select id="transactionProduct" required>
                <option value="">Select Product</option>
            </select>

            <label>Transaction Type</label>
            <select id="transactionType" required>
                <option value="">Select Type</option>
                <option value="Purchase">Purchase (Add Stock)</option>
                <option value="Sale">Sale (Remove Stock)</option>
            </select>

            <label>Select Supplier (Required for Purchase)</label>
            <select id="transactionSupplier">
                <option value="">Select Supplier</option>
            </select>

            <label>Quantity</label>
            <input type="number" id="transactionQuantity" min="1" step="1" required>

            <label>Transaction Date</label>
            <input type="date" id="transactionDate" required>

            <button type="submit">Save Transaction</button>
        </form>

        <p id="transactionMessage" class="message"></p>

        <h2>Transaction History</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th>Supplier</th>
                        <th>Type</th>
                        <th>Quantity</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="transactionsTable"></tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
