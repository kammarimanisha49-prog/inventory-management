<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Inventory Management System</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="products.html">Products</a>
            <a href="suppliers.html">Suppliers</a>
            <a href="transactions.html">Transactions</a>
        </nav>
    </header>

    <main>
        <h2>Manage Products</h2>

        <form id="productForm">
            <input type="hidden" id="productId">

            <label>Product Name</label>
            <input type="text" id="productName" required>

            <label>Category</label>
            <input type="text" id="category" required>

            <label>Price</label>
            <input type="number" id="price" min="0" step="0.01" required>

            <label>Quantity</label>
            <input type="number" id="quantity" min="0" step="1" required>

            <label>Reorder Level</label>
            <input type="number" id="reorderLevel" min="0" step="1" required>

            <button type="submit" id="productSubmit">Add Product</button>
            <button type="button" class="secondary" onclick="resetProductForm()">Clear</button>
        </form>

        <p id="productMessage" class="message"></p>

        <h2>Product List</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Reorder Level</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="productsTable"></tbody>
            </table>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
